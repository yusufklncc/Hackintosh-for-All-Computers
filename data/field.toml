# What somebody actually observed, where no upstream document says anything.
#
# Every other table here rests on a machine-readable source or on a quoted
# sentence. This one does not: it holds findings from running macOS on the
# hardware, and each entry names who found it and what exactly they saw. That
# is a weaker kind of evidence than a kext's own Info.plist and it is labelled
# as such wherever it is used, but a machine somebody has actually booted beats
# a table that has never heard of it.
#
# An entry earns its place by being specific about the observation. "Does not
# work" is not an entry; "installs, but graphics acceleration cannot be made to
# work" is.

# Intel iGPUs, matched on the processor model as the machine reports it.
# Dortania states iGPU support per generation and WhateverGreen per device id.
# Neither reaches a single SKU, so a processor whose iGPU behaves differently
# from its generation can only be recorded here.
[[igpu]]
cpu = "i5-10200H"
status = "unsupported"
observed_by = "yusufklncc"
observed = "macOS installs, but graphics acceleration cannot be made to work"
note = "Comet Lake is supported as a generation, so the generation rule alone would call this one supported."

# The Mac identity a config claims, where somebody has run the combination and
# the tables can only say what Apple serves. `data/smbios.toml` joined to
# macrecovery's board list says how far an identity is offered; whether an
# install then completes on hardware that is not that Mac is a different
# question, and only running it answers that.
[[smbios]]
model = "MacBookPro16,1"
macos = "26"
cpu = "i5-7200U"
observed_by = "yusufklncc"
observed = "Tahoe boots its recovery and installs, on Kaby Lake hardware, with this identity"
note = """-no_compat_check gets a boot past the model check; it does not carry \
an install through on an identity the release does not serve. Its place is \
after the install, once the proper identity is put back."""

# An iGPU presented as a different one, where WhateverGreen states no fake and
# somebody has run it anyway. `fake` is the device-id property; `platform_id`
# is the framebuffer that has to go with it, because a faked id with the
# framebuffer of the real part is not the configuration that was reported.
[[igpu_id]]
profile = "ice-lake"
id = "8086:8a56"
fake = "5c8a0000"
platform_id = "01005c8a"
source = "https://github.com/Freddywhest/Opencore-HP-Pavilion-10th-gen-Intel-Core-i5-1035G1"
observed = "a published EFI for an HP Pavilion 15 with an i5-1035G1, running Ventura, presents the G1 as an Iris Plus G4"
note = """WhateverGreen lists the Ice Lake UHD/Iris Plus G1 as unsupported and \
states no fake for it. This is one config that does it and reports working, \
not a sentence from the project that writes the driver."""
