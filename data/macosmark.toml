[[mark]]
name = "Sierra"
letter = "S"
from = "#334a5e"
to = "#6b8296"

[[mark]]
name = "El Capitan"
letter = "E"
from = "#1f3a63"
to = "#4a6d9c"

[[mark]]
name = "Yosemite"
letter = "Y"
from = "#2b4a7a"
to = "#5b7fae"

# The row with no version. It asks Apple for whatever is being served today, so
# it is not a release and does not borrow a release's colour - it takes the
# program's own accent, the one the navigation already uses.
[latest]
letter = "?"
from = "#3e3ba8"
to = "#6f6ad6"
