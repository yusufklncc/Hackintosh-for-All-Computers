# macOS release names and the Darwin kernel majors they ship.
#
# OpenCore bounds kexts by Darwin version, while people know their machine by
# the macOS name, so one table has to bridge the two. Six of these rows are
# cross-checked against this repository's own AMD patch comments by
# tools/coverage.py --names, which recovers them from the tree independently.
[[release]]
name = "Yosemite"
version = "10.10"
darwin = 14

[[release]]
name = "El Capitan"
version = "10.11"
darwin = 15

