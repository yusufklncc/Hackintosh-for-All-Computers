# What OpenCore Legacy Patcher restores, and from which macOS.
#
# Generated by tools/oclptable.py --refresh from OCLP's own PATCHEXPLAIN page,
# which lists each patch set with the macOS it applies from.
#
# `ceiling_version` is not on the patch page - it says where each set starts and
# never where it stops. It is the newest macOS OCLP has published a support page
# for, which is as far as the project itself claims to go.
#
# `applies_to` is this repository's own name for the family, so a card can be
# joined to a patch set. The page writes "Kepler" and the GPU table keys on the
# chip prefix GK; the two vocabularies are matched here and nowhere else.
#
# OCLP patches an installed macOS, not an EFI. Nothing a build produces changes
# because of this table - it is here so a card that stops being supported can
# say what happens next.

source = "https://dortania.github.io/OpenCore-Legacy-Patcher/PATCHEXPLAIN.html"
ceiling_source = "https://dortania.github.io/OpenCore-Legacy-Patcher/MODELS.html"
ceiling_name = "Sequoia"
ceiling_version = "15"

[[patch]]
name = "Audio Patches"
from = "11.0"
reason = ""
graphics = false

[[patch]]
name = "Legacy Wireless Patches"
from = "12.0"
reason = ""
graphics = false

[[patch]]
name = "NVIDIA Kepler Graphics Acceleration Patches"
from = "12.0"
reason = ""
graphics = true
nvidia_chips = ["GK"]

[[patch]]
name = "Intel Ivy Bridge Graphics Acceleration Patches"
from = "12.0"
reason = ""
graphics = true
igpu_profiles = ["ivy-bridge"]

[[patch]]
name = "Intel Haswell Graphics Acceleration Patches"
from = "13.0"
reason = ""
graphics = true
igpu_profiles = ["haswell"]

[[patch]]
name = "Intel Broadwell Graphics Acceleration Patches"
from = "13.0"
reason = ""
graphics = true
igpu_profiles = ["broadwell"]

[[patch]]
name = "Intel Skylake Graphics Acceleration Patches"
from = "13.0"
reason = ""
graphics = true
igpu_profiles = ["sky-lake"]

[[patch]]
name = "AMD Legacy Vega Graphics Acceleration Patches"
from = "13.0"
reason = ""
graphics = true
card_families = ["Vega 10 series", "Vega 20 series"]

[[patch]]
name = "AMD Legacy Polaris Graphics Acceleration Patches"
from = "13.0"
reason = ""
graphics = true
card_families = ["Polaris 10 and 20 series"]

[[patch]]
name = "non-Metal Graphics Acceleration Patches"
from = "11.0"
reason = ""
graphics = true
