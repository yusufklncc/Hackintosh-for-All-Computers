# Realtek card readers, from the driver's own device table.
#
# Parsed by tools/cardtable.py from 0xFireWolf/RealtekCardReader's README, which
# publishes a device id, a name and whether each one works. macOS
# ships no driver for these, so without this the answer for a card
# reader was "there is one" and nothing more.
#
# supported = false is the project saying it knows the device and does
# not drive it, which is a different answer from silence.
# Source: https://github.com/0xFireWolf/RealtekCardReader
[driver]
kext = "RealtekCardReader.kext"
project = "0xFireWolf/RealtekCardReader"
license = "BSD-3-Clause"
systems = ["macOS Monterey", "macOS Big Sur", "macOS Catalina", "macOS Mojave"]
note = "the project calls itself Pre-1.0 Beta and says other systems are not tested yet"

[[device]]
id = "0bda:0129"
name = "RTS5129 USB 2.0/3.0 Card Reader"
series = "51X9"
supported = true
since = "0.9.5"

