# Drivers and add-ons this repository does not write, and knows about.
#
# One registry for everything community-made: a GPU driver Apple never wrote,
# a Wi-Fi kext for a card macOS has no driver for, an AirDrop or Handoff add-on,
# a CPU tweak. Each one is somebody else's project, recorded so that a person
# with that hardware is told it exists - never so that it is claimed to work.
#
# PROVENANCE, per field:
#   ids        read from the kext's own Info.plist in the release named
#              (ids_from = "kext"), or quoted from the project's own table
#              (ids_from = "quoted"), or its rule file ("rules"), or its stated
#              chip families ("chips")
#   licence    as GitHub reads the project's LICENSE
#   sha256     of the release asset named, as downloaded
#   ai         only where the project itself says it was written with AI,
#              quoted from ai_source; absent means it does not say, not no
#   quote, and whatever else `quoted` names
#              the project's own sentences, at the commit recorded; checked
#              word for word against its page every week
#
# stage: watching      known, not shown
#        experimental  shown beside Apple's verdict; offered, never added unasked
#        recommended   somebody named has run it (data/field.toml)
#        vendored      ships in EFI/OC/Kexts like the other kexts
#
# install: efi     it goes in the EFI as a kext
#          system  it is installed on macOS by its own installer, after boot
#
# tools/community.py --refresh re-reads every derived field and reports a
# changed quote for a person; tools/community.py --discover lists projects
# that are not here yet. Neither adds a project: that is a decision.
[[project]]
name = "intel-gpu-macos-driver"
ai = "**Built with AI.** This project is developed with AI assistance."
