[[project]]
name = "AirPort_RTW89"
quoted = ["quote", "macos"]
repo = "FranciumOS-org/AirPort_RTW89"
kind = "device"
role = "wifi"
stage = "experimental"
install = "efi"
licence = "GPL-2.0"
release = "v0.7.0-BETA"
asset = "AirPort_RTW89-0.7.0.zip"
sha256 = "dde4e5a9e2b36784cc0e2d62eb3cf60b561dd6964f0edd3ae86ef3ce128f70af"
commit = "607a97b86ad6d5cdd10e4566a3afe0cafde46404"
source = "README.md"
ids_from = "kext"
ids = ["10ec:882d", "10ec:8852", "10ec:8922", "10ec:892b", "10ec:892d", "10ec:895d", "10ec:a85a", "10ec:b520", "10ec:b851", "10ec:b852", "10ec:b85b", "10ec:c852"]
macos = "Tested on macOS Sequoia 15 and Tahoe 26."
min_darwin = 24
quote = "USB versions of these cards are not supported."
covers = "Realtek RTL8852BE/AE/CE/BTE, RTL8851BE, RTL8922AE/DE Wi-Fi"
conflicts = ["AirportItlwm.kext", "RTLAirLink"]
needs = "the old Wi-Fi stack (IOSkywalkFamily, IO80211FamilyLegacy, AMFIPass from OpenCore Legacy Patcher), SecureBootModel Disabled, a Kernel -> Block for IOSkywalkFamily, and -amfipassbeta on Tahoe"
how = "its own Kext Installer edits the EFI; by hand, the README lists every step"

[project.recipe]
from = "README.md"
steps = ["Copy `AirPort_RTW89.kext` and the three kexts into `EFI/OC/Kexts`.", "Delete `IO80211FamilyLegacy.kext/Contents/PlugIns/AirPortBrcmNIC.kext` (it is for Broadcom cards).", "It must be: Lilu, IOSkywalkFamily, IO80211FamilyLegacy, AMFIPass, AirPort_RTW89, then its plugin `AirPort_RTW89.kext/Contents/PlugIns/AirPortRTW89Front.kext`.", "Add to `Kernel -> Block`: `Identifier` `com.apple.iokit.IOSkywalkFamily`, `Strategy` `Exclude`, `Arch` `x86_64`, `MinKernel` `23.0.0`, `Enabled` true.", "Set `Misc -> Security -> SecureBootModel` to `Disabled`.", "On macOS Tahoe, add `-amfipassbeta` to `boot-args`.", "If the same EFI also boots Ventura or older, give the four kexts `MinKernel` `23.0.0`."]
add = ["IOSkywalkFamily.kext", "IO80211FamilyLegacy.kext", "AMFIPass.kext", "AirPort_RTW89.kext", "AirPort_RTW89.kext/Contents/PlugIns/AirPortRTW89Front.kext"]
min_kernel = "23.0.0"
remove = ["IO80211FamilyLegacy.kext/Contents/PlugIns/AirPortBrcmNIC.kext"]
secure_boot_model = "Disabled"

[[project.recipe.block]]
identifier = "com.apple.iokit.IOSkywalkFamily"
strategy = "Exclude"
min_kernel = "23.0.0"

[[project.recipe.boot_args]]
arg = "-amfipassbeta"
from_darwin = 25

[[project.recipe.extra]]
name = "IOSkywalkFamily.kext"
url = "https://github.com/dortania/OpenCore-Legacy-Patcher/raw/d9604c36a432eaf243ea18659ff4d208187452d7/payloads/Kexts/Wifi/IOSkywalkFamily-v1.2.0.zip"
sha256 = "1e12b7ef42f55b39ea54ada97b46331220668b2c48a28656e9875c5145fe2479"
from = "OpenCore Legacy Patcher, which the README links at this commit"

[[project.recipe.extra]]
name = "IO80211FamilyLegacy.kext"
url = "https://github.com/dortania/OpenCore-Legacy-Patcher/raw/d9604c36a432eaf243ea18659ff4d208187452d7/payloads/Kexts/Wifi/IO80211FamilyLegacy-v1.0.0.zip"
sha256 = "e681dcc76a2cd2cea4b0ad5f27a3c816055fde3cdccd890dd10a3e2c84e96d93"
from = "OpenCore Legacy Patcher, which the README links at this commit"

