# Laptop input: which kext a trackpad needs.
#
# The kext rules are quoted from their own documentation, where they are
# stated in prose and nowhere machine-readable.
#
# The controller ids are not here: VoodooI2C declares them itself, in the
# IOPCIMatch and IONameMatch of its own Info.plist, so tools/hwtable.py reads
# them into data/hardware.toml with everything else. They used to be a hand
# expanded copy in this file, which was right but could drift.

[[rule]]
bus = "i2c"
label = "I2C trackpad"
kexts = ["VoodooI2C.kext", "VoodooI2CHID.kext"]
quote = "Attaches to I2C controllers to allow plugins to talk to I2C trackpads. Must be paired with one or more plugins"
note = "VoodooI2CHID covers I2C-HID devices, which is most of them. ELAN, Synaptics and FTE trackpads have their own plugin in the same release."

[[rule]]
bus = "smbus-synaptics"
label = "Synaptics SMBus trackpad"
kexts = ["VoodooRMI.kext"]
quote = "For systems with Synaptics SMBus trackpads. Requires macOS 10.11 or newer for MT2 functions. Depends on Acidanthera's VoodooPS2"

[[rule]]
bus = "smbus-elan"
label = "ELAN SMBus trackpad"
kexts = ["VoodooSMBus.kext"]
min_kernel = "18.0.0"
quote = "For systems with ELAN SMBus Trackpads. Supports macOS 10.14 or newer"

[keyboard]
source = "https://dortania.github.io/OpenCore-Install-Guide/ktext.html"
quote = "Most laptop keyboards are PS2! You will want to grab VoodooPS2 even if you have an I2C, USB, or SMBus trackpad."
