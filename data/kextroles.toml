# What each vendored kext is for, for the Kexts pane: a group to file it under,
# and one sentence in its own project's words.
#
# The group is this repository's filing, nothing more. The sentence is quoted:
# from the project's README at the commit named, with Markdown taken out, or
# from the one-line description its GitHub page carries (`@description`). A
# kext from a project that says nothing about it on its own gets the project's
# line, marked as the project's; one with no upstream recorded gets none.
#
# Read 2026-11-23.

