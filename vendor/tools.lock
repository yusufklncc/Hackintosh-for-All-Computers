sha256 = "93f1f48e6f1ea26b14b45f4a0b6e65a660c1cc6f14969348ec9411ae6b969c12"
upstream = "acidanthera/MaciASL"
license = "ACPICA (Intel or GPL-2.0)"
note = "built by MaciASL from ACPICA"

