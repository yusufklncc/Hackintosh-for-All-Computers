# Programs vendored whole, as their projects publish them.
#
# A kext is a bundle this repository copies into an EFI; these are tools that
# run on the person's machine. They are pinned the same way: a version, the
# upstream that published it, and a hash of the exact file, so what ships is
# what was checked rather than whatever the project has today.
#
# Each one keeps its own LICENSE beside it. The LICENSE at the root of this
# repository covers what is written here and nothing else.

[tool."USBToolBox/Windows.exe"]
version = "0.2"
sha256 = "715532b242b65be1a93759c67efe9b7987c99e505cd790d4aa9bbca551493177"
upstream = "USBToolBox/tool"
license = "MIT"
# The Python source needs the wmi and pywin32 packages, which this repository
# has none of and does not want. The project publishes this build for exactly
# that reason, so the build is what is vendored.
note = "the released Windows build, not the source"
# SSDTTime, vendored as source: it is standard library only, so the
# whole tree is here and no interpreter has to be found for it.
[tool."SSDTTime"]
version = "3b195df"
sha256 = ""   # a tree, not a file; the commit is the pin
upstream = "corpnewt/SSDTTime"
license = "MIT"
note = "the source tree at that commit, copied out and driven"

# iasl compiles the SSDTs and acpidump reads the tables off the machine.
# Both are ACPICA, dual licensed Intel or GPL-2.0; the Intel option is the
# one taken, and condition 3.3 requires its notice to travel with the
# binaries, which is what ACPICA-LICENSE.txt is.

