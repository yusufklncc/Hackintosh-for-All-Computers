name: refresh

# The generated tables are snapshots of other people's work: Dortania's GPU
# guide, AppleALC's layouts, the kexts' own device lists. They go stale quietly
# - a card gains support, a codec gains a layout, and nothing here notices.
#
# So once a week this regenerates them and, if anything moved, opens a pull
# request with the diff. It never merges: the diff is the point, because a
# change here is a change to what people are told about their hardware.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # The Recovery tab depends on somebody else's server still behaving. Apple
  # can stop serving a board or change the protocol, and the first anybody
  # would know is a person pressing Download and getting an error. So ask once
  # a week, the same way the tab asks, and keep none of it: what is checked is
  # that the request works, not what it returns.
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The list is readable without asking anyone
        run: python3 tools/recoverycheck.py --catalogue
      - name: And Apple still answers
        run: python3 tools/recoverycheck.py | tee /tmp/recovery.log
      - name: Say so
        if: always()
        run: |
          echo '### Recovery' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/recovery.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY


  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate the tables from their sources
        run: |
          python3 tools/gputable.py --out data/gpu.toml
          python3 tools/audiotable.py --out data/audio.toml
          python3 tools/fbtable.py --out data/framebuffer.toml
          python3 tools/cardtable.py --out data/cardreader.toml
          # new Macs appear in this one, and every identity a config claims is
          # measured against it
          python3 tools/smbios.py --refresh
          python3 tools/thirdparty.py --refresh
          python3 tools/thirdparty.py --fetch

      - name: Anything moved?
        id: diff
        run: |
          {
            echo "Regenerated from the upstream sources. Nothing here was decided by"
            echo "the run - the diff is what moved."
            echo
            echo '```'
            git diff --stat -- data
            echo '```'
            echo
            echo "### Kexts against their upstream tags"
            echo
            echo "Not changed by this run: updating a kext is a decision, not a refresh."
            echo
            echo '```'
            python3 tools/kexts.py outdated || true
            echo '```'
          } > pr-body.md
          if git diff --quiet -- data; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "the tables still match their sources"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            git diff --stat -- data
          fi

      - name: Still valid after the refresh
        if: steps.diff.outputs.changed == 'yes'
        run: |
          chmod +x vendor/opencore/*/Utilities/*/*.linux
          python3 tools/selftest.py
          python3 tools/setup.py --machine tools/fixtures/no-hardware.json \
            --hda-ids 10ec:0255 --answers 2,10,3,9 --out /tmp/refresh/EFI

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'yes'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh/hardware-tables
          title: Hardware tables have moved upstream
          commit-message: Refresh the generated hardware tables
          body-path: pr-body.md
          add-paths: data
          delete-branch: true
