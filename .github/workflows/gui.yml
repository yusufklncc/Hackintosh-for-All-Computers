name: gui

# Builds the window and takes its picture.
#
# A window is the deliverable here, and nobody can review a window from a build
# log. Every run renders both themes against a fixture - a real laptop, not
# whatever the runner happens to be - and uploads them, so a change to the
# layout can be looked at the way a change to the code is read.

on:
  workflow_dispatch:
  # release.yml builds the packages by calling this, so what ships is what was
  # exercised here rather than a second build of it
  workflow_call:
  push:
    branches: [main, 'beta/**']
    paths: ['gui/**', 'tools/**', 'data/**', 'vendor/**',
            '.github/workflows/gui.yml']
  pull_request:
    paths: ['gui/**', 'tools/**', 'data/**', 'vendor/**']

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: HackintoshEFIBuilder.exe
          - os: ubuntu-latest
            rid: linux-x64
            exe: HackintoshEFIBuilder
          # macOS is where an EFI often gets finished rather than started: the
          # target machine's report travels to the Mac and the build happens
          # there. The window has to open on it, so it is built and drawn here
          # like the other two.
          - os: macos-latest
            rid: osx-arm64
            exe: HackintoshEFIBuilder
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # the shell runs the engine rather than reimplementing it, so the engine
      # has to be runnable here: from a clone that means Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: X server for the Linux run
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: It builds
        run: dotnet build gui/Shell.csproj -c Release --nologo

      # Published before it is drawn, because the published file is what people
      # get. Rendering with `dotnet run` tested a layout that was never shipped:
      # the single file was missing its native Skia library and died on startup,
      # and nothing here noticed for four green runs.
      - name: And it publishes as one file
        run: >
          dotnet publish gui/Shell.csproj -c Release -o out
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishTrimmed=true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true

      # Against a fixture, not against the runner. A Hyper-V VM has almost no
      # hardware to describe, and a screenshot of an empty table reviews nothing.
      # Two widths on purpose: the Linux runner gets a screen big enough for the
      # window it asks for, and the Windows runner's 1024x768 shows what the
      # same layout does when it cannot have it.
      - name: It draws a machine
        shell: bash
        run: |
          ${{ runner.os == 'Linux' && 'xvfb-run -a -s "-screen 0 1440x1000x24" ' || '' }}"out/${{ matrix.exe }}" \
            --machine tools/fixtures/thinkpad-e570.json --render "$PWD/shell.png" \
            | tee render.log
          test -s shell.png || { echo 'no light screenshot'; exit 1; }
          test -s shell-dark.png || { echo 'no dark screenshot'; exit 1; }
          test -s shell-builder.png || { echo 'no builder screenshot'; exit 1; }
          # the pane is only worth a picture if an engine answered into it
          grep -qE 'builder: [1-9][0-9]* lines, asking ".+" with [1-9]' render.log \
            || { echo 'the builder pane never got a question'; cat render.log; exit 1; }
          # and it has to be able to finish one, not only start it
          grep -q 'drive: rc=0 Written:' render.log \
            || { echo 'the builder pane never finished a build'; cat render.log; exit 1; }
          for pane in report devices kexts about; do
            test -s "shell-$pane.png" || { echo "no $pane screenshot"; exit 1; }
          done
          grep -q 'report: Written ->' render.log \
            || { echo 'the report pane wrote nothing'; cat render.log; exit 1; }

          # the recovery pane offers a list and nothing else here presses its
          # button: a build machine has no business pulling 700 MB off Apple
          grep -qE 'recovery: [1-9][0-9]* recoveries, newest .+, into com.apple.recovery.boot' \
            render.log \
            || { echo 'the recovery pane listed nothing'; cat render.log; exit 1; }

          # the stick pane on a machine with no stick in it. Zero is the right
          # answer here and the pane has to reach it rather than throw - and
          # nothing in this pass erases anything.
          grep -qE 'stick: [0-9]+ sticks, [0-9]+ ready, erasable=(True|False), into com.apple.recovery.boot' \
            render.log \
            || { echo 'the stick pane did not report'; cat render.log; exit 1; }

      # A font that failed to load falls back to the system's, and the window
      # still looks reasonable. That is the whole problem: it has to be checked,
      # not eyeballed.
      - name: In the faces it was set in
        shell: bash
        run: |
          cat render.log
          grep -q 'typeface Sans/400 -> Instrument Sans 400' render.log
          grep -q 'typeface Sans/600 -> Instrument Sans 600' render.log
          grep -q 'typeface Mono/400 -> IBM Plex Mono 400' render.log

      - name: What it costs
        shell: bash
        run: |
          size=$(stat -c %s "out/${{ matrix.exe }}" 2>/dev/null || stat -f %z "out/${{ matrix.exe }}")
          echo "### ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "single file: $size bytes" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: shell-${{ matrix.rid }}
          path: |
            shell.png
            shell-dark.png
            shell-builder.png
            shell-report.png
            shell-devices.png
            shell-kexts.png
            shell-about.png
            out/${{ matrix.exe }}

  # What a person actually downloads: the window and the engine in one folder.
  # The window runs the engine rather than reimplementing it, so shipping one
  # without the other ships nothing that works.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            shell_exe: HackintoshEFIBuilder.exe
            engine_exe: EFIBuilderEngine.exe
          - os: ubuntu-latest
            rid: linux-x64
            shell_exe: HackintoshEFIBuilder
            engine_exe: EFIBuilderEngine
          - os: macos-latest
            rid: osx-arm64
            shell_exe: HackintoshEFIBuilder
            engine_exe: EFIBuilderEngine
          # Intel Macs are the ones people still convert things for, and the
          # arm64 build will not run on one
          - os: macos-latest
            rid: osx-x64
            shell_exe: HackintoshEFIBuilder
            engine_exe: EFIBuilderEngine
            cross: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller

      - name: X server for the Linux run
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: The vendored tools are executable
        if: runner.os != 'Windows'
        run: chmod +x vendor/opencore/*/Utilities/*/* || true

      - name: The engine
        run: pyinstaller --clean --noconfirm --distpath package tools/pyinstaller.spec

      - name: The window, beside it
        run: >
          dotnet publish gui/Shell.csproj -c Release -o package
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishTrimmed=true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -p:DebugSymbols=false

      # The window looks for the engine beside itself first and falls back to a
      # clone. On this runner a clone is right there, so the check is not that
      # it worked - it is that it used the packaged engine and not the source.
      - name: It uses the engine it shipped with
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          # from a scratch directory, not from inside the package: a build
          # writes its EFI, its ACPI tables and its NEXT-STEPS into the working
          # directory, and all of that used to land among the two programs
          mkdir -p scratch && cd scratch
          ${{ runner.os == 'Linux' && 'xvfb-run -a -s "-screen 0 1400x1000x24" ' || '' }}../package/${{ matrix.shell_exe }} \
            --machine ../tools/fixtures/thinkpad-e570.json --render "$PWD/shot.png" \
            | tee render.log
          grep -q 'engine: beside this window' render.log \
            || { echo 'it did not use the packaged engine'; cat render.log; exit 1; }
          test -s shot.png || { echo 'it drew nothing'; exit 1; }

      - name: How long reading a machine takes here
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          mkdir -p scratch && cd scratch
          start=$(date +%s)
          ../package/EFIBuilderEngine/${{ matrix.engine_exe }} --describe > described.json
          echo "### ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "describe took $(( $(date +%s) - start ))s" >> $GITHUB_STEP_SUMMARY
          python -c "import json; d=json.load(open('described.json')); \
            print('rows', len(d['rows']), 'read', d['read'])" \
            >> $GITHUB_STEP_SUMMARY

      # A package holds two programs and nothing else. Exercising it here used
      # to write an EFI, a report and a NEXT-STEPS beside them, and all of that
      # shipped: somebody unzipped the release and found notes about a machine
      # that was not theirs. The runs happen in a scratch directory now, so
      # this is a check rather than a cleaner - anything it has to remove is a
      # step writing where it should not, and it says so.
      - name: Nothing but the two programs
        shell: bash
        run: |
          cd package
          for leftover in *; do
            case "$leftover" in
              ${{ matrix.shell_exe }}|EFIBuilderEngine) ;;
              *) echo "::warning::$leftover was left in the package by a build step"
                 rm -rf "$leftover" ;;
            esac
          done
          ls -A | sort > /tmp/shipped
          printf '%s\n%s\n' 'EFIBuilderEngine' '${{ matrix.shell_exe }}' \
            | sort > /tmp/wanted
          diff /tmp/wanted /tmp/shipped \
            || { echo 'the package is not the two programs'; exit 1; }

      # macOS: a folder of files is not how a program arrives here. A bare
      # Mach-O opens Terminal when double-clicked, shows a generic icon, and
      # puts the process name in the menu bar - all of it for want of an
      # Info.plist, which is what this writes.
      - name: A .app, on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 tools/appbundle.py --from package \
            --out "package-app/Hackintosh EFI Builder.app" \
            --version "$(basename $(ls -d vendor/opencore/*/ | head -1))"
          app="package-app/Hackintosh EFI Builder.app"
          test -x "$app/Contents/MacOS/HackintoshEFIBuilder"
          test -d "$app/Contents/Resources/EFIBuilderEngine"
          test -f "$app/Contents/Resources/HackintoshEFIBuilder.icns"
          # the name in the menu bar comes from here, and the icon from the Dock
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist" \
            | grep -q 'Hackintosh EFI Builder'
          # and it has to be signed, or Apple silicon will not start it at all
          codesign --verify --deep --strict "$app" \
            || { echo 'the bundle is not signed'; exit 1; }
          rm -rf package && mv package-app package

      # Linux: one file that runs wherever, which is the same promise the rest
      # of this makes. The folder goes in the zip too, for anyone who would
      # rather have it.
      - name: An AppImage, on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y desktop-file-utils zsync
          curl -sSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
          python3 tools/appimage.py --from package --appdir /tmp/AppDir \
            --out "package/Hackintosh EFI Builder.AppImage"
          test -x "package/Hackintosh EFI Builder.AppImage"
          # it has to start, and the only thing that proves that is starting it
          xvfb-run -a -s "-screen 0 1400x1000x24" \
            "package/Hackintosh EFI Builder.AppImage" --appimage-extract-and-run \
            --machine tools/fixtures/thinkpad-e570.json --render /tmp/appimage.png \
            > /tmp/appimage.log 2>&1 || true
          grep -q 'engine: beside this window' /tmp/appimage.log \
            || { echo 'the AppImage did not find its engine'; cat /tmp/appimage.log; exit 1; }
          test -s /tmp/appimage.png || { echo 'the AppImage drew nothing'; exit 1; }

      # Zipped here, not later. An artifact is a file tree, and uploading one
      # loses what a .app is made of: the symlinks inside Python.framework came
      # back as missing files and the signature with them, so macOS called the
      # app damaged. A zip made on the machine that built it keeps the links,
      # the modes and the seal.
      - name: Into the zip it ships as
        shell: bash
        run: |
          mkdir -p out
          # the AppImage is the whole program again; it goes out on its own
          for one in package/*.AppImage; do
            [ -e "$one" ] || continue
            mv "$one" "out/HackintoshEFIBuilder-${{ matrix.rid }}.AppImage"
          done
          if [ "$RUNNER_OS" = "macOS" ]; then
            # ditto, because zip on macOS is not what preserves a bundle
            # no --keepParent: with "." as the source it stores the folder
            # the files are in, and the .app came back one level down
            (cd package && ditto -c -k --sequesterRsrc . \
              "../out/HackintoshEFIBuilder-${{ matrix.rid }}.zip")
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # no zip on a Windows runner, and nothing in this package needs a
            # symlink kept, so PowerShell's own archiver will do
            powershell -NoProfile -Command \
              "Compress-Archive -Path package\* -DestinationPath out/HackintoshEFIBuilder-${{ matrix.rid }}.zip -Force"
          else
            (cd package && zip -qry \
              "../out/HackintoshEFIBuilder-${{ matrix.rid }}.zip" .)
          fi
          ls -la out

      - name: And it comes out of that zip whole
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p proof && cd proof
          ditto -x -k "../out/HackintoshEFIBuilder-${{ matrix.rid }}.zip" .
          codesign --verify --deep --strict "Hackintosh EFI Builder.app" \
            || { echo 'the bundle does not survive its own zip'; exit 1; }
          test -L "Hackintosh EFI Builder.app/Contents/Resources/EFIBuilderEngine/_internal/Python.framework/Versions/Current" \
            || { echo 'the framework symlinks did not survive'; exit 1; }
          # and it has to find its engine from in there. Run from a clone the
          # window walks up and finds tools/setup.py, which hid the fact that
          # it never looked in Contents/Resources: a downloaded app opened to
          # "no engine found".
          "Hackintosh EFI Builder.app/Contents/MacOS/HackintoshEFIBuilder" \
            --machine ../tools/fixtures/thinkpad-e570.json \
            --render "$PWD/inbundle.png" > bundle.log 2>&1 || true
          grep -q 'engine: inside this app' bundle.log \
            || { echo 'the bundle did not find the engine inside itself'; \
                 cat bundle.log; exit 1; }
          cd .. && rm -rf proof

      - name: What it weighs
        shell: bash
        run: |
          du -sh package out >> $GITHUB_STEP_SUMMARY
          ls -la out >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}-package
          path: out/
