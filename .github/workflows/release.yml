name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish under
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify before publishing anything
        run: |
          python3 tools/kexts.py check
          python3 tools/verify.py --comments

      - name: Build every published config
        run: |
          chmod +x vendor/opencore/*/Utilities/*/*.linux
          python3 tools/release.py --out dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*.zip
          body: |
            EFI folders built from the profiles in this repository, one per
            published config. Each contains only what its config references.

            Every build carries a freshly generated serial, MLB and UUID. `ROM`
            is still a placeholder: it has to be your own machine's MAC address.
            See the Post Installation section of the README.
