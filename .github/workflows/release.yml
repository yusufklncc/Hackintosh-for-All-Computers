name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish under
        required: true

jobs:
  windows-exe:
    uses: ./.github/workflows/windows-exe.yml

  # the window and its engine, one folder per system
  packages:
    uses: ./.github/workflows/gui.yml

  build:
    needs: [windows-exe, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify before publishing anything
        run: |
          python3 tools/kexts.py check
          python3 tools/verify.py --comments

      - name: Build every published config
        run: |
          chmod +x vendor/opencore/*/Utilities/*/*.linux
          python3 tools/release.py --out dist

      # into a folder of its own: upload-artifact stores the contents of a
      # directory at the artifact root, so downloading to dist/ would scatter
      # the engine's _internal beside the zips
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/EFIBuilderEngine

      # the console program, named for what it is next to a window with the
      # product name on it
      # a folder now, so it ships as a zip like the others
      - run: |
          cd dist && zip -qr HackintoshEFIBuilder-console-win-x64.zip EFIBuilderEngine \
            && rm -rf EFIBuilderEngine

      # Each package is a folder of two programs. A release carries files, so
      # each becomes one zip named for the system it runs on.
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: packages

      # The packages arrive as the zips their own build made. Re-zipping them
      # here is what broke the .app: an artifact is a file tree, and a bundle
      # does not survive being carried as one.
      - name: The packages, as their builds zipped them
        run: |
          mv packages/*/*.zip packages/*/*.AppImage dist/ 2>/dev/null || true
          mv packages/*.zip packages/*.AppImage dist/ 2>/dev/null || true
          chmod +x dist/*.AppImage 2>/dev/null || true
          ls -la dist

      # What changed, from docs/releases/<tag>.md, and a short list of the
      # files. The page used to be a how-to repeated on every release, which
      # told nobody what was different about this one. No notes file, no
      # release: a version that cannot say what it changed is not ready.
      - name: The notes say what changed
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          test -s "docs/releases/$tag.md" \
            || { echo "::error::docs/releases/$tag.md is missing"; exit 1; }
          cat "docs/releases/$tag.md" docs/releases/downloads.md > notes.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.zip
            dist/*.AppImage
            dist/HackintoshEFIBuilder-console-win-x64.zip
          body_path: notes.md
