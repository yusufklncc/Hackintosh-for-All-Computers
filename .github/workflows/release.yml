name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish under
        required: true

jobs:
  windows-exe:
    uses: ./.github/workflows/windows-exe.yml

  # the window and its engine, one folder per system
  packages:
    uses: ./.github/workflows/gui.yml

  build:
    needs: [windows-exe, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify before publishing anything
        run: |
          python3 tools/kexts.py check
          python3 tools/verify.py --comments

      - name: Build every published config
        run: |
          chmod +x vendor/opencore/*/Utilities/*/*.linux
          python3 tools/release.py --out dist

      # into a folder of its own: upload-artifact stores the contents of a
      # directory at the artifact root, so downloading to dist/ would scatter
      # the engine's _internal beside the zips
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/EFIBuilderEngine

      # the console program, named for what it is next to a window with the
      # product name on it
      # a folder now, so it ships as a zip like the others
      - run: |
          cd dist && zip -qr HackintoshEFIBuilder-console-win-x64.zip EFIBuilderEngine \
            && rm -rf EFIBuilderEngine

      # Each package is a folder of two programs. A release carries files, so
      # each becomes one zip named for the system it runs on.
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: packages

      - name: One zip per system
        run: |
          cd packages
          for made in *-package; do
            system="${made%-package}"
            # upload-artifact does not carry the executable bit, and a .app
            # whose binary cannot run is a folder with an icon
            chmod +x "$made"/EFIBuilderEngine/EFIBuilderEngine \
                     "$made"/HackintoshEFIBuilder \
                     "$made"/*.app/Contents/MacOS/HackintoshEFIBuilder \
                     "$made"/*.app/Contents/Resources/EFIBuilderEngine/EFIBuilderEngine \
                     2>/dev/null || true
            # the AppImage is the same program again, so it goes out as its
            # own asset rather than doubling the size of the folder zip
            for one in "$made"/*.AppImage; do
              [ -e "$one" ] || continue
              mv "$one" "dist/HackintoshEFIBuilder-$system.AppImage"
              chmod +x "dist/HackintoshEFIBuilder-$system.AppImage"
              echo "  $system  AppImage $(du -h "dist/HackintoshEFIBuilder-$system.AppImage" | cut -f1)"
            done
            (cd "$made" && zip -qr "../../dist/HackintoshEFIBuilder-$system.zip" .)
            echo "  $system  $(du -sh "$made" | cut -f1)"
          done

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.zip
            dist/*.AppImage
            dist/HackintoshEFIBuilder-console-win-x64.zip
          body: |
            **`HackintoshEFIBuilder-win-x64.zip`** is the easy path: unzip it and
            run `HackintoshEFIBuilder.exe`. A window that reads your machine,
            says what macOS will and will not drive in it, and writes the EFI
            folder. Nothing to install. The same package is there for
            `linux-x64` and `osx-arm64`.

            On macOS the zip holds **Hackintosh EFI Builder.app**; on Linux
            there is a single **`.AppImage`** as well as the folder, and it
            runs on whatever distribution you have without installing anything.

            **`HackintoshEFIBuilder-console-win-x64.zip`** is the same builder
            without a window, for anyone who prefers a terminal or is working
            over one.

            Everything ships as a folder rather than a single file. A one-file
            build unpacks itself into a temporary directory on every run, which
            is what Windows Defender flags as a trojan - it did, on a real
            machine. Neither program is signed, so the first run may still need
            "More info" then "Run anyway" on Windows, or an allow in System
            Settings on macOS.

            The remaining two zips are the manual path. `EFI-base.zip` is the EFI folder;
            `configs.zip` holds one `config.plist` per supported machine.

            1. Extract `EFI-base.zip` - you get an `EFI` folder.
            2. Open `configs.zip`, find the entry matching your hardware, and copy
               that `.plist` into `EFI/OC/` renamed to `config.plist`.
            3. Copy the `EFI` folder to the EFI partition of your USB drive.

            OpenCore loads only what the config names, so one base serves every
            machine.

            Each config ships with a generated serial, MLB and UUID, but everyone
            downloading the same file shares them. Generate your own with
            GenSMBIOS, and set `ROM` to your own MAC address, before signing in to
            iCloud, iMessage or FaceTime. The Post Installation section of the
            README walks through it.
