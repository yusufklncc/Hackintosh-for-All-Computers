name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make the vendored tools executable
        run: chmod +x vendor/opencore/*/Utilities/*/*.linux

      - name: Kexts match the lock
        run: python3 tools/kexts.py check

      - name: Profiles still produce every published config
        run: python3 tools/verify.py --comments

      - name: Representative builds come out clean
        run: |
          python3 tools/build.py --platform laptop --cpu kaby-lake --oem hp --out /tmp/a/EFI
          python3 tools/build.py --platform desktop --vendor amd \
            --cpu ryzen-threadripper --cores 8 --chipset b550-a520 --out /tmp/b/EFI
          python3 tools/build.py --name 'Desktop/Intel/016 - Desktop - Raptor Lake' --out /tmp/c/EFI

      - name: The interactive builder still runs
        run: |
          python3 tools/setup.py --answers 2,10,3 --out /tmp/setup-laptop/EFI
          python3 tools/setup.py --answers 1,2,2,3,6 --out /tmp/setup-amd/EFI
          python3 tools/detect.py
          python3 tools/advise.py --ids 8086:15b8,8086:2723 --usb-ids 8087:0029
          python3 tools/advise.py --ids 10ec:c822

      - name: Network kexts, both modes and declining
        run: |
          IDS='--ids 8086:15b8 --usb-ids 8087:0029'
          python3 tools/setup.py $IDS --answers 2,10,3,1   --out /tmp/net-all/EFI
          python3 tools/setup.py $IDS --answers 2,10,3,2,10 --out /tmp/net-sonoma/EFI
          python3 tools/setup.py $IDS --answers 2,10,3,3   --out /tmp/net-none/EFI

      - name: Wi-Fi resolves to one build, or to none
        run: |
          python3 tools/setup.py --ids 8086:2723 --answers 2,10,3,2,10 --out /tmp/wifi-sonoma/EFI
          test -d /tmp/wifi-sonoma/EFI/OC/Kexts/AirportItlwm.kext
          # v2.3.0 has no Sequoia build; shipping the wrong one would be worse
          python3 tools/setup.py --ids 8086:2723 --answers 2,10,3,2,11 --out /tmp/wifi-sequoia/EFI
          test ! -d /tmp/wifi-sequoia/EFI/OC/Kexts/AirportItlwm.kext
          python3 tools/itlwm.py

      - name: The hardware table still matches the kexts
        run: |
          python3 tools/hwtable.py EFI/OC/Kexts --out /tmp/hardware.toml
          diff /tmp/hardware.toml data/hardware.toml

      - name: Release packaging works
        run: python3 tools/release.py --out /tmp/dist --limit 5
