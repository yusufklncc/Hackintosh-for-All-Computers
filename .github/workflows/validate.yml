name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make the vendored tools executable
        run: chmod +x vendor/opencore/*/Utilities/*/*.linux

      - name: Workflows are valid YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml,glob,sys; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflows parse')"

      - name: Kexts match the lock
        run: python3 tools/kexts.py check

      - name: Profiles still produce every published config
        run: python3 tools/verify.py --comments

      - name: What the tools advise is still what they should
        run: python3 tools/selftest.py

      - name: Representative builds come out clean
        run: |
          # NONE starts from a report describing no hardware, so the questions
          # are the same on every runner. Detecting the runner instead makes the
          # answer string depend on whether it happens to have an NVMe drive.
          NONE='--machine tools/fixtures/no-hardware.json'
          python3 tools/setup.py $NONE --answers 2,10,3,9 --out /tmp/laptop/EFI
          python3 tools/setup.py $NONE --answers 1,2,2,3,6,8 --out /tmp/amd/EFI

          # the identity a config claims has a ceiling of its own. Asking for a
          # macOS past it has to be said out loud: the install stops with no
          # sign why, and the hardware is not what stopped it.
          # 4 is the last option: keep the identity the profile picked
          python3 tools/setup.py $NONE --answers 2,10,3,12,4 --out /tmp/toolate/EFI \
            | tee /tmp/toolate.log
          grep -q 'MacBookPro14,1' /tmp/toolate.log
          grep -qi 'is past that' /tmp/toolate.log \
            || { echo 'asking for Tahoe on a Ventura identity said nothing'; exit 1; }
          grep -q 'MacBookPro16,1' /tmp/toolate.log \
            || { echo 'it did not name an identity that is served it'; exit 1; }
          python3 -c "import plistlib,sys; \
            g=plistlib.load(open('/tmp/toolate/EFI/OC/config.plist','rb'))['PlatformInfo']['Generic']; \
            sys.exit(0 if g['SystemProductName']=='MacBookPro14,1' else 1)" \
            || { echo 'declining still changed the identity'; exit 1; }

          # and taking the offer swaps it, with a serial minted for the new one
          python3 tools/setup.py $NONE --answers 2,10,3,12,1 --out /tmp/swapped/EFI \
            | tee /tmp/swapped.log
          grep -q 'MacBookPro14,1 -> MacBookPro16,1' /tmp/swapped.log \
            || { echo 'taking the offer did not swap the identity'; exit 1; }
          python3 -c "import plistlib,sys; \
            g=plistlib.load(open('/tmp/swapped/EFI/OC/config.plist','rb'))['PlatformInfo']['Generic']; \
            sys.exit(0 if g['SystemProductName']=='MacBookPro16,1' and g['SystemSerialNumber'] else 1)" \
            || { echo 'the swapped config has the wrong identity or no serial'; exit 1; }
          # the profile on disk is untouched: this is one build's identity
          grep -q 'MacBookPro14,1' profiles/cpu/laptop/kaby-lake.toml
          # and one that fits says so without a warning
          python3 tools/setup.py $NONE --answers 2,10,3,9 --out /tmp/intime/EFI \
            | tee /tmp/intime.log
          grep -q 'served up to Ventura' /tmp/intime.log
          ! grep -qi 'is past that' /tmp/intime.log
          python3 tools/build.py --name 'Desktop/Intel/016 - Desktop - Raptor Lake' --out /tmp/named/EFI
          # a whole real machine, which is the only fixture the fast path and
          # the framebuffer menu can both be exercised from
          E570='--machine tools/fixtures/thinkpad-e570.json'
          # 1 takes the detected profile, 1 the recommended framebuffer, 1 the kexts
          python3 tools/setup.py $E570 --answers 1,9,1,1 --out /tmp/fast/EFI
          test -d /tmp/fast/EFI/OC/Kexts/AirportBrcmFixup.kext
          test -d /tmp/fast/EFI/OC/Kexts/NVMeFix.kext
          # 2 answers the profile questions by hand instead
          python3 tools/setup.py $E570 --answers 2,2,10,6,9,1,1 --out /tmp/byhand/EFI
          # the last framebuffer option leaves the key out; the one before it is
          # the id that boots without acceleration
          python3 tools/setup.py $E570 --answers 1,9,16,1 --out /tmp/fb-none/EFI
          python3 tools/setup.py $E570 --answers 1,9,15,1 --out /tmp/fb-noaccel/EFI
          # a processor whose iGPU a field report says does not accelerate: no
          # framebuffer section, no menu, and the profile's placeholder removed
          # an id in a supported generation that is not natively supported:
          # still supported, flagged as needing a faked device-id
          WSK='--machine tools/fixtures/whiskey-lake.json'
          # 3 declines the faked device-id: this step is about the profile,
          # not about what to present the iGPU as
          python3 tools/setup.py $WSK --answers 1,9,1,3,1 --out /tmp/whiskey/EFI
          python3 -c "import plistlib,sys; \
            p=plistlib.load(open('/tmp/whiskey/EFI/OC/config.plist','rb'))\
              ['DeviceProperties']['Add']['PciRoot(0x0)/Pci(0x2,0x0)']; \
            sys.exit(0 if 'device-id' not in p else 1)" \
            || { echo 'declining still faked the device-id'; exit 1; }

          # and taking it writes what the document says, on the same device
          python3 tools/setup.py $WSK --answers 1,9,1,2,1 --out /tmp/whiskey-fake/EFI
          python3 -c "import plistlib,sys; \
            p=plistlib.load(open('/tmp/whiskey-fake/EFI/OC/config.plist','rb'))\
              ['DeviceProperties']['Add']['PciRoot(0x0)/Pci(0x2,0x0)']; \
            sys.exit(0 if p.get('device-id')==bytes.fromhex('a53e0000') else 1)" \
            || { echo 'the faked device-id did not land'; exit 1; }
          python3 tools/summary.py $WSK | grep -q 'not natively'
          CML='--machine tools/fixtures/comet-lake-h.json'
          python3 tools/setup.py $CML --answers 1,9,3 --out /tmp/field/EFI
          python3 - <<'CHECK'
          import plistlib
          d = plistlib.load(open('/tmp/field/EFI/OC/config.plist', 'rb'))
          got = d['DeviceProperties']['Add'].get('PciRoot(0x0)/Pci(0x2,0x0)', {})
          assert 'AAPL,ig-platform-id' not in got, got
          CHECK

      - name: Storage advice
        run: |
          NONE='--machine tools/fixtures/no-hardware.json'
          python3 tools/setup.py $NONE --nvme 'Samsung SSD 970 EVO' --answers 2,10,3,9,1 --out /tmp/nvme/EFI
          test -d /tmp/nvme/EFI/OC/Kexts/NVMeFix.kext
          python3 tools/setup.py $NONE --nvme 'APPLE SSD AP0512'    --answers 2,10,3,9 --out /tmp/apple-nvme/EFI
          test ! -d /tmp/apple-nvme/EFI/OC/Kexts/NVMeFix.kext

      - name: Network kexts, both modes and declining
        run: |
          IDS='--machine tools/fixtures/no-hardware.json --ids 8086:15b8 --usb-ids 8087:0029'
          python3 tools/setup.py $IDS --answers 2,10,3,9,1    --out /tmp/net-all/EFI
          python3 tools/setup.py $IDS --answers 2,10,3,10,4,2 --out /tmp/net-sonoma/EFI
          python3 tools/setup.py $IDS --answers 2,10,3,9,3    --out /tmp/net-none/EFI
          test -d /tmp/net-all/EFI/OC/Kexts/IntelMausi.kext
          test ! -d /tmp/net-none/EFI/OC/Kexts/IntelMausi.kext

      - name: Wi-Fi resolves to one build, or to none
        run: |
          NONE='--machine tools/fixtures/no-hardware.json'
          python3 tools/setup.py $NONE --ids 8086:2723 --answers 2,10,3,10,4,2 --out /tmp/wifi-sonoma/EFI
          test -d /tmp/wifi-sonoma/EFI/OC/Kexts/AirportItlwm.kext
          python3 tools/setup.py $NONE --ids 8086:2723 --answers 2,10,3,11,4,2 --out /tmp/wifi-sequoia/EFI
          test ! -d /tmp/wifi-sequoia/EFI/OC/Kexts/AirportItlwm.kext
          python3 tools/setup.py $NONE --ids 14e4:43a3 --answers 2,10,3,9,1 --out /tmp/wifi-brcm/EFI
          test -d /tmp/wifi-brcm/EFI/OC/Kexts/AirportBrcmFixup.kext
          python3 tools/itlwm.py

      - name: Trackpad, framebuffer and a user-made USB map
        run: |
          NONE='--machine tools/fixtures/no-hardware.json'
          python3 tools/setup.py $NONE --ids 8086:9d60 --answers 2,10,3,9,1 --out /tmp/i2c/EFI
          test -d /tmp/i2c/EFI/OC/Kexts/VoodooI2C.kext
          # Haswell and Broadwell put the controller on ACPI, with no PCI id
          python3 tools/setup.py $NONE --acpi-ids INT33C2 --answers 2,7,3,7,1 --out /tmp/i2c-acpi/EFI
          test -d /tmp/i2c-acpi/EFI/OC/Kexts/VoodooI2C.kext
          python3 tools/setup.py $NONE --ids 8086:5912 --answers 2,10,3,9 --out /tmp/fb/EFI
          cp -r EFI/OC/Kexts/UTBDefault.kext /tmp/UTBMap.kext
          python3 tools/setup.py $NONE --ids 8086:2723 --usb-map /tmp/UTBMap.kext \
            --answers 2,10,3,10,4,2 --out /tmp/usbmap/EFI
          test -d /tmp/usbmap/EFI/OC/Kexts/UTBMap.kext
          test ! -d /tmp/usbmap/EFI/OC/Kexts/UTBDefault.kext

      - name: Building for a machine that is not this one
        run: |
          # a real round trip: this runner's own hardware, written out and read
          # back. The trailing 3 declines whatever it has, since that varies.
          python3 tools/detect.py --report /tmp/machine.json
          python3 tools/setup.py --machine /tmp/machine.json --answers 2,10,3,9,3 \
            --out /tmp/from-report/EFI
          # menu route: 2 picks the report, then its path, then the usual answers
          python3 tools/setup.py --answers 2,/tmp/machine.json,2,10,3,9,3 --out /tmp/menu-report/EFI
          # 3 is the other machine with no report: network hardware is named,
          # here Intel Ethernet, no Wi-Fi, Intel Bluetooth, for every macOS
          python3 tools/setup.py --answers 3,2,10,3,9,1,3,1,1 --out /tmp/by-name/EFI
          test -d /tmp/by-name/EFI/OC/Kexts/IntelMausi.kext
          test -d /tmp/by-name/EFI/OC/Kexts/IntelBluetoothFirmware.kext
          test ! -d /tmp/by-name/EFI/OC/Kexts/AirportItlwm.kext

      - name: The vendored tools load
        run: python3 tools/setup.py --check-tools

      - name: The vendored ACPI tools are the files that were checked
        run: |
          python3 - <<'CHECK'
          import sys; sys.path.insert(0, 'tools')
          import acpi
          assert acpi.available(), 'SSDTTime is not usable here'
          ok, detail = acpi.verify()
          assert ok, detail
          work = acpi.prepare('/tmp/acpi-work')
          names = {p.name for p in (work / 'Scripts').iterdir()}
          assert any(n.startswith('iasl') for n in names), sorted(names)
          module = acpi.load(work)
          ssdt = module.SSDT()
          assert ssdt.d.iasl and str(work) in str(ssdt.d.iasl), ssdt.d.iasl
          assert ssdt.d.iasl_legacy, 'no legacy compiler, so it would download one'
          print(f'SSDTTime {detail}, compiler found without reaching the network')
          CHECK

      - name: An SSDT built for the machine replaces the generic one
        run: |
          mkdir -p /tmp/Results
          python3 - <<'CHECK'
          import plistlib
          from pathlib import Path
          r = Path('/tmp/Results')
          (r / 'SSDT-PLUG.aml').write_bytes(b'SSDT' + bytes(32))
          with open(r / 'patches_OC.plist', 'wb') as fh:
              plistlib.dump({'ACPI': {'Patch': [{'Comment': 'x', 'Find': b'EC0_',
                                                 'Replace': b'EC__'}]}}, fh)
          CHECK
          python3 tools/build.py --platform laptop --cpu kaby-lake \
            --acpi /tmp/Results --out /tmp/acpi-efi/EFI
          test -f /tmp/acpi-efi/EFI/OC/ACPI/SSDT-PLUG.aml
          python3 - <<'CHECK'
          import plistlib
          d = plistlib.load(open('/tmp/acpi-efi/EFI/OC/config.plist', 'rb'))
          by = {e['Path']: e for e in d['ACPI']['Add']}
          assert by['SSDT-PLUG.aml']['Enabled'], by
          assert by['SSDT-PLUG-DRTNIA.aml']['Enabled'] is False, by
          print('the generic SSDT is off, the tailored one is on')
          CHECK

      - name: The vendored USB tool is the file that was checked
        run: |
          python3 tools/usbmap.py

      - name: What we ship and what we do not
        run: |
          python3 tools/thirdparty.py
          python3 tools/thirdparty.py --machine tools/fixtures/thinkpad-e570.json

      - name: A trackpad on SMBus is told apart from one on PS/2
        run: |
          python3 - <<'CHECK'
          import sys; sys.path.insert(0, 'tools')
          import detect, summary
          base, _ = detect.read_report('tools/fixtures/thinkpad-e570.json')
          row = lambda hw: {r['part']: r for r in summary.rows(hw)}['Trackpad']
          assert 'PS/2' in row(base)['detail'], row(base)
          smbus = dict(base, device_names={**base['device_names'],
                                           '8086:9d23': 'Synaptics SMBus Driver'})
          assert 'VoodooRMI.kext' in row(smbus)['detail'], row(smbus)
          print('SMBus and PS/2 are told apart')
          CHECK

      - name: The SSDTs that decide for themselves, against a DSDT
        run: |
          NONE='--machine tools/fixtures/no-hardware.json'
          python3 tools/setup.py $NONE --acpi-tables tools/fixtures/acpi \
            --answers 2,10,3,9 --out /tmp/autossdt/EFI
          ls /tmp/autossdt/EFI/OC/ACPI/
          test -f /tmp/autossdt/EFI/OC/ACPI/SSDT-EC.aml
          test -f /tmp/autossdt/EFI/OC/ACPI/SSDT-PLUG.aml
          python3 tools/kextorder.py /tmp/autossdt/EFI/OC/config.plist

      - name: Every kext is listed after the ones it needs
        run: python3 tools/kextorder.py

      - name: Choosing SMBus follows the project's own install order
        run: |
          E570='--machine tools/fixtures/thinkpad-e570.json'
          python3 - <<'MAKE'
          import json
          d = json.load(open('tools/fixtures/thinkpad-e570.json'))
          d['device_names']['8086:9d23'] = 'Synaptics SMBus Driver'
          json.dump(d, open('/tmp/smbus.json', 'w'))
          MAKE
          python3 tools/setup.py --machine /tmp/smbus.json --answers 1,9,1,1,1 \
            --out /tmp/smbus/EFI
          python3 - <<'CHECK'
          import plistlib
          d = plistlib.load(open('/tmp/smbus/EFI/OC/config.plist', 'rb'))
          by = {k['BundlePath']: k for k in d['Kernel']['Add']}
          for want in ('VoodooRMI.kext',
                       'VoodooRMI.kext/Contents/PlugIns/VoodooInput.kext',
                       'VoodooSMBus.kext',
                       'VoodooRMI.kext/Contents/PlugIns/RMISMBus.kext'):
              assert by[want]['Enabled'], want
          off = 'VoodooPS2Controller.kext/Contents/PlugIns/VoodooInput.kext'
          assert by[off]['Enabled'] is False, 'two VoodooInput kexts would load'
          for keep in ('VoodooPS2Controller.kext',
                       'VoodooPS2Controller.kext/Contents/PlugIns/VoodooPS2Trackpad.kext'):
              assert by[keep]['Enabled'], keep
          print('the SMBus set is complete and VoodooInput is not doubled')
          CHECK

      - name: The card reader has three answers, not one
        run: |
          python3 - <<'CHECK'
          import sys; sys.path.insert(0, 'tools')
          import detect, summary
          base, _ = detect.read_report('tools/fixtures/thinkpad-e570.json')
          def verdict(hw_id):
              hw = dict(base, peripherals=base['peripherals'] + [
                  {'kind': 'card reader', 'name': 'Reader', 'id': hw_id,
                   'driver': 'rtsper', 'usb': False, 'virtual': False}])
              return [r for r in summary.rows(hw) if r['part'] == 'Card reader'][0]
          assert verdict(r'PCI\VEN_10EC&DEV_5227')['verdict'] == summary.SUPPORTED
          assert verdict(r'PCI\VEN_10EC&DEV_5261')['verdict'] == summary.UNSUPPORTED
          assert verdict(r'PCI\VEN_1217&DEV_8621')['verdict'] == summary.UNKNOWN
          print('card reader: three answers')
          CHECK

      - name: The hardware summary
        run: |
          NONE='--machine tools/fixtures/no-hardware.json'
          python3 tools/summary.py $NONE
          python3 tools/setup.py --check $NONE
          python3 tools/summary.py
          python3 tools/setup.py --check

      - name: Detection and advice run standalone
        run: |
          python3 tools/provenance.py
          python3 tools/detect.py
          python3 tools/inputdev.py
          python3 tools/igpu.py
          python3 tools/advise.py --ids 8086:15b8,8086:2723 --usb-ids 8087:0029
          python3 tools/advise.py --ids 10ec:c822
          python3 tools/gpu.py
          python3 tools/audio.py

      - name: Release packaging works
        run: python3 tools/release.py --out /tmp/dist --limit 5
